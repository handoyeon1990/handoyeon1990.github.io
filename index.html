<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장비·차량 작업계획서</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:#f5f7fb;color:#172033;display:grid;place-items:center;min-height:100vh}
.box{max-width:560px;margin:24px;padding:24px;background:#fff;border:1px solid #dfe5ee;border-radius:14px;box-shadow:0 2px 10px rgba(16,24,40,.05);text-align:center}
h1{font-size:22px;margin:0 0 10px}.muted{color:#667085;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="box" id="status"><h1>작업계획서 불러오는 중</h1><div class="muted">잠시만 기다려주세요.</div></div>
<script>
(async()=>{
  try{
    const res=await fetch("https://otbsdsiaybypsxydcjlp.supabase.co/functions/v1/work-plan?v=3",{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const html=await res.text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById("status").innerHTML="<h1>페이지를 불러오지 못했습니다</h1><div class='muted'>인터넷 연결을 확인한 뒤 새로고침해주세요.<br>"+String(err.message||err)+"</div>";
  }
})();
</script>
</body>
</html>
