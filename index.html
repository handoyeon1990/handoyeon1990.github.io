<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --line:#dfe5ee; --text:#172033; --muted:#667085;
    --accent:#275DAD; --accent2:#eaf1fb; --danger:#b42318; --ok:#067647; --warn:#b54708;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text)}
  header{background:#173b6c;color:white;padding:18px 16px}
  header .wrap{max-width:1180px;margin:auto}
  h1{font-size:24px;margin:0 0 6px}
  .sub{opacity:.85;font-size:14px}
  main{max-width:1180px;margin:18px auto;padding:0 14px 40px}
  .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(16,24,40,.04);padding:16px}
  .card h2{font-size:18px;margin:0 0 14px}
  .card h3{font-size:15px;margin:18px 0 10px}
  .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-size:13px;font-weight:700;color:#344054}
  input,select,textarea{width:100%;border:1px solid #cfd7e3;border-radius:9px;padding:10px 11px;background:white;font:inherit;color:var(--text)}
  input[readonly]{background:#f8fafc;color:#475467}
  textarea{min-height:120px;resize:vertical}
  .wide{grid-column:1/-1}
  .specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .spec{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fbfcfe}
  .spec .k{font-size:12px;color:var(--muted)}
  .spec .v{margin-top:3px;font-size:14px;font-weight:700;word-break:keep-all}
  .refbox{padding:12px;border-radius:10px;background:var(--accent2);border:1px solid #bfd2f1;font-size:14px;line-height:1.55}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  button{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:750;cursor:pointer}
  .primary{background:var(--accent);color:white}
  .secondary{background:#eef2f6;color:#344054}
  .danger{background:#fee4e2;color:var(--danger)}
  .ghost{background:white;border:1px solid var(--line);color:#344054}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
  th{background:#f8fafc;font-size:12px;color:#475467}
    .radio{display:flex;justify-content:center}
  .radio input{width:auto}
  .history{margin-top:16px}
  .empty{color:var(--muted);text-align:center;padding:22px 8px}
  .badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2f6;color:#475467}
  .bad{background:#fee4e2;color:var(--danger)}
  .good{background:#dcfae6;color:var(--ok)}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .small{font-size:12px;color:var(--muted)}
  .record-actions{display:flex;gap:5px;flex-wrap:wrap}
  .record-actions button{padding:6px 8px;font-size:12px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}.fields,.specs{grid-template-columns:1fr}.wide{grid-column:auto}.route-image-grid{grid-template-columns:1fr}}
  .route-flow{margin-top:12px}
  .route-image-wrap{border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;overflow:hidden}
  .route-image{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;border-radius:8px;background:#f8fafc}
  .route-image-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .route-image-card{border:1px solid var(--line);border-radius:10px;padding:7px;background:#fff}
  .route-image-label{font-size:12px;font-weight:800;color:#475467;margin:0 0 6px}
  .route-source-note{font-size:11px;color:var(--muted);margin-top:6px}
  #printSheet{display:none}
  .print-doc{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#111}
  .print-title{text-align:center;font-size:24px;font-weight:900;margin-bottom:14px}
  .print-meta,.print-table{width:100%;border-collapse:collapse;table-layout:fixed}
  .print-meta th,.print-meta td,.print-table th,.print-table td{border:1px solid #555;padding:7px 8px;font-size:12px;vertical-align:middle}
  .print-meta th,.print-table th{background:#f0f0f0;font-weight:800}
  .print-section-title{font-weight:900;font-size:15px;margin:15px 0 7px}
  .print-route{border:1px solid #555;padding:8px;margin-top:5px;text-align:center}
  .print-route img{display:block;width:auto;max-width:100%;max-height:82mm;margin:0 auto;object-fit:contain}
  .print-route .print-route-label{font-size:11px;font-weight:800;margin:0 0 5px;text-align:left}

  @media print{

    .print-section-title{font-size:13px;margin:10px 0 5px}
    .print-section{break-inside:auto}

<body>
<header>
  <div class="wrap">
    <h1>장비·차량 작업계획서</h1>
    <div class="sub">장비 선택에 따라 제원·작업범위·운전자 점검항목·원본 작업동선도가 자동으로 바뀝니다.</div>
  </div>
</header>

<main>
  <div class="grid">
    <section class="card">
      <h2>1. 장비 선택 및 작업 기록</h2>

        <div class="field">

          <input id="category" readonly />
        </div>
        <div class="field">
          <label>차량번호</label>
          <input id="vehicleNo" readonly />
        </div>
        <div class="field">
          <label for="workDate">날짜</label>
          <input id="workDate" type="date" />
        </div>
        <div class="field">
          <label for="place">작업장소</label>
          <select id="place">
            <option value="">선택하세요</option>
            <option value="내항">내항</option>
            <option value="외항">외항</option>
            <option value="집하장">집하장</option>
          </select>
        </div>
        <div class="field">
          <label for="startTime">시작시간</label>
          <select id="startTime"></select>
        </div>
        <div class="field">
          <label for="endTime">종료시간</label>
          <select id="endTime"></select>
        </div>
        <div class="field">
          <label for="worker">운전자 및 작업자</label>
          <select id="worker">
            <option value="">선택하세요</option>
            <option value="강영우">강영우</option>
            <option value="김기범">김기범</option>
            <option value="이재철">이재철</option>
            <option value="김홍진">김홍진</option>
            <option value="송종열">송종열</option>
            <option value="강상우">강상우</option>
            <option value="전이경">전이경</option>
          </select>
        </div>
        <div class="field">
          <label>작업시간</label>
          <input id="duration" readonly placeholder="시작/종료시간 입력 시 자동 계산" />
        </div>
        <div class="field wide">
          <label for="workContent">작업내용</label>

        </div>
        <div class="field wide">
          <label for="remarks">특이사항</label>
          <textarea id="remarks" placeholder="특이사항이 있으면 입력하세요. 없으면 비워두셔도 됩니다." style="min-height:90px"></textarea>
        </div>
        <div class="field">
          <label for="writer">작성자</label>
          <select id="writer">
            <option value="">선택하세요</option>
            <option value="강영우">강영우</option>
            <option value="김기범">김기범</option>
            <option value="이재철">이재철</option>
            <option value="김홍진">김홍진</option>
            <option value="송종열">송종열</option>
            <option value="강상우">강상우</option>
            <option value="전이경">전이경</option>
          </select>
        </div>
        <div class="field">
          <label for="supervisor">관리감독자</label>
          <input id="supervisor" value="한도연" readonly />
        </div>
      </div>

      <h3>양식상 기본 작업범위 (참고)</h3>
      <div class="refbox" id="defaultWork"></div>

      <div class="actions no-print">
        <button class="primary" id="saveBtn">기록 저장</button>
        <button class="secondary" id="clearBtn">입력 초기화</button>
        <span class="small" style="align-self:center">※ 출력은 기록을 저장한 뒤 아래 저장 기록에서 가능합니다.</span>
      </div>
    </section>

    <section class="card">
      <h2>2. 기계·장비 제원</h2>
      <div class="specs" id="specs"></div>
      <h3>운행경로 / 작업 참고</h3>
      <div class="refbox" id="route"></div>
      <h3>작업 동선도</h3>
      <div class="route-flow" id="routeFlow"></div>
    </section>
  </div>

  <section class="card" style="margin-top:16px">
    <div class="topline">
      <h2>3. 운전자 점검항목</h2>
      <span class="small">장비 선택 시 점검항목 자동 변경</span>
    </div>
    <div style="overflow:auto">
      <table class="check-table">
        <thead>
          <tr><th style="width:60px">번호</th><th>운전자 점검항목</th></tr>
        </thead>
        <tbody id="checklist"></tbody>
      </table>
    </div>
  </section>

  <section class="card history">
    <div class="topline">
      <div>
        <h2 style="margin-bottom:4px">4. 저장 기록</h2>
        <div class="small">저장된 기록만 출력할 수 있습니다. 휴대폰·PC에서 같은 온라인 기록을 공유합니다.</div>
      </div>
      <div class="actions no-print" style="margin:0">
        <button class="ghost" id="refreshBtn">새로고침</button>
        <button class="ghost" id="csvBtn">CSV 내보내기</button>
        <button class="danger" id="deleteAllBtn">전체 삭제</button>
      </div>
    </div>
    <div style="overflow:auto;margin-top:10px">
      <table>
        <thead>
          <tr>
            <th>날짜</th><th>장비</th><th>장소</th><th>작업시간</th><th>작업내용</th><th>특이사항</th><th>관리</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </section>
</main>

<section id="printSheet"></section>

async function apiRequest(url, options={}){
  const headers = Object.assign({
    "apikey": SUPABASE_KEY,
    "Content-Type": "application/json"
  }, options.headers || {});
  const res = await fetch(url, Object.assign({}, options, {headers}));
  if(!res.ok){
    const msg = await res.text();
    throw new Error(msg || `HTTP ${res.status}`);
  }
  if(res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function getRouteImageEntries(key, place=""){
  const cfg=ROUTE_IMAGES[key];
  if(!cfg) return [];
  if(key==="water"){
    if(place==="내항" && cfg["내항"]) return [cfg["내항"]];
    if(place==="외항" && cfg["외항"]) return [cfg["외항"]];
    return [cfg["내항"],cfg["외항"]].filter(Boolean);
  }
  return cfg.default ? [cfg.default] : [];
}

function routeImageHtml(key, place="", forPrint=false){
  const entries=getRouteImageEntries(key,place);
  if(!entries.length) return "";
  if(forPrint){
    return entries.map(x=>`<div style="margin-bottom:${entries.length>1?'7px':'0'}"><div class="print-route-label">${escapeHtml(x.label)}</div><img src="${x.src}" alt="${escapeHtml(x.label)}"></div>`).join("");
  }
  if(entries.length===1){
    const x=entries[0];
    return `<div class="route-image-wrap"><img class="route-image" src="${x.src}" alt="${escapeHtml(x.label)}"><div class="route-source-note">첨부 작업계획서 원본 동선 그림</div></div>`;
  }
  return `<div class="route-image-grid">${entries.map(x=>`<div class="route-image-card"><div class="route-image-label">${escapeHtml(x.label)}</div><img class="route-image" src="${x.src}" alt="${escapeHtml(x.label)}"></div>`).join("")}</div><div class="route-source-note">작업장소를 내항/외항으로 선택하면 해당 동선만 표시됩니다.</div>`;
}

const $ = id => document.getElementById(id);

function fillTimeOptions(){
  ["startTime","endTime"].forEach(id=>{
    const sel=$(id);
    sel.innerHTML='<option value="">선택하세요</option>';
    for(let total=9*60; total<=17*60+30; total+=30){
      const h=Math.floor(total/60);
      const m=total%60;
      const value=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
      const opt=document.createElement("option");
      opt.value=value;
      opt.textContent=value;
      sel.appendChild(opt);
    }
  });
}

const order = ["water","truck_5t","porter","bongo","loader_new","loader_old"];
order.forEach(k=>{

});

function renderEquipment(){
  const key=equipment.value, e=EQUIPMENT[key];
  $("category").value=e.category;
  $("vehicleNo").value=e.vehicleNo;
  $("defaultWork").textContent=e.defaultWork;
  $("route").textContent=e.route;
  $("routeFlow").innerHTML=routeImageHtml(key,$("place").value,false);
  $("specs").innerHTML=Object.entries(e.specs).map(([k,v])=>`<div class="spec"><div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div></div>`).join("");
  $("checklist").innerHTML=e.checklist.map((item,i)=>`
    <tr>
      <td style="text-align:center;font-weight:700">${i+1}</td>
      <td>${escapeHtml(item)}</td>
    </tr>`).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function calcDuration(){
  const s=$("startTime").value, e=$("endTime").value;
  if(!s||!e){$("duration").value="";return;}
  const [sh,sm]=s.split(":").map(Number), [eh,em]=e.split(":").map(Number);
  let mins=(eh*60+em)-(sh*60+sm); if(mins<0) mins+=24*60;
  $("duration").value=`${Math.floor(mins/60)}시간 ${mins%60}분`;
}

function clearInputs(keepDate=true){
  ["place","startTime","endTime","worker","workContent","remarks","writer"].forEach(id=>$(id).value=""); $("supervisor").value="한도연";
  if(!keepDate) $("workDate").value="";
  $("duration").value="";
  $("routeFlow").innerHTML=routeImageHtml(equipment.value,$("place").value,false);
}
function records(){ return recordCache; }

async function loadCloudRecords(){
  try{
    const data = await apiRequest(`${API_URL}?select=*&order=created_at.desc`, {
      method:"GET",
      headers:{"Accept":"application/json"}
    });
    recordCache = (data || []).map(r => ({
      id: r.id,
      date: r.work_date,
      equipmentKey: r.equipment_key,
      equipment: r.equipment,
      vehicleNo: r.vehicle_no,
      place: r.place || "",
      start: r.start_time || "",
      end: r.end_time || "",
      duration: r.duration || "",
      worker: r.worker || "",
      content: r.content || "",
      remarks: r.remarks || "",
      writer: r.writer || "",
      supervisor: r.supervisor || "한도연",
      checks: []
    }));
    renderHistory();
  }catch(err){
    console.error(err);
    $("historyBody").innerHTML=`<tr><td colspan="7" class="empty">온라인 기록을 불러오지 못했습니다.<br>${escapeHtml(err.message)}</td></tr>`;
  }
}

$("saveBtn").addEventListener("click", async ()=>{
  if(!$("workDate").value){alert("날짜를 입력해주세요.");return;}
  if(!$("workContent").value.trim()){alert("작업내용을 입력해주세요.");return;}

  const e=EQUIPMENT[equipment.value];
  const payload={
    work_date:$("workDate").value,
    equipment_key:equipment.value,
    equipment:e.name,
    vehicle_no:e.vehicleNo,
    place:$("place").value,
    start_time:$("startTime").value,
    end_time:$("endTime").value,
    duration:$("duration").value,
    worker:$("worker").value,
    content:$("workContent").value.trim(),
    remarks:$("remarks").value.trim(),
    writer:$("writer").value,
    supervisor:"한도연"
  };

  const btn=$("saveBtn");
  btn.disabled=true;
  btn.textContent="저장 중...";
  try{
    await apiRequest(API_URL,{
      method:"POST",
      headers:{"Prefer":"return=minimal"},
      body:JSON.stringify(payload)
    });
    await loadCloudRecords();
    alert("온라인 작업 기록에 저장되었습니다. 휴대폰과 PC에서 같은 기록을 조회할 수 있습니다.");
    clearInputs(true);
  }catch(err){
    console.error(err);
    alert("저장하지 못했습니다. 인터넷 연결을 확인해주세요.");
  }finally{
    btn.disabled=false;
    btn.textContent="기록 저장";
  }
});

          <th>운전자 및 작업자</th>
          <td>${escapeHtml(data.worker || "-")}</td>
          <th style="width:18%">작업일시</th>
          <td>${escapeHtml(data.date || "-")}</td>
        </tr>
        <tr>
          <th>작업장소</th>
          <td>${escapeHtml(data.place || "-")}</td>
          <th>작업시간</th>
          <td>${escapeHtml(timeText)}</td>
        </tr>
        <tr>
          <th>작업내용</th>
          <td colspan="3" style="height:62px">${escapeHtml(data.content || "-").replace(/\n/g,"<br>")}</td>
        </tr>
        <tr class="print-sign">
          <th>작성자</th>
          <td>${escapeHtml(data.writer || "")}</td>
          <th>관리감독자</th>
          <td>${escapeHtml(data.supervisor || "")}</td>
        </tr>
      </table>

      <div class="print-section">

      </div>

          <tr><th style="width:130px">운행경로</th><td>${escapeHtml(e.route)}</td></tr>

          <tbody>${checklistHtml}</tbody>

          <tr>

function renderHistory(){
  const arr=records(), body=$("historyBody");
  if(!arr.length){body.innerHTML=`<tr><td colspan="7" class="empty">저장된 작업 기록이 없습니다.</td></tr>`;return;}
  body.innerHTML=arr.map(r=>{
    return `<tr>
      <td>${escapeHtml(r.date)}</td>
      <td>${escapeHtml(r.equipment)}<br><span class="small">${escapeHtml(r.vehicleNo)}</span></td>
      <td>${escapeHtml(r.place||"-")}</td>
      <td>${escapeHtml(r.duration||[r.start,r.end].filter(Boolean).join("~")||"-")}</td>
      <td style="min-width:220px">${escapeHtml(r.content)}</td>
      <td style="min-width:180px">${escapeHtml(r.remarks||"-")}</td>
      <td><div class="record-actions"><button class="ghost" onclick="loadRecord(${r.id})">불러오기</button><button class="ghost" onclick="printRecord(${r.id})">출력</button><button class="danger" onclick="deleteRecord(${r.id})">삭제</button></div></td>
    </tr>`;
  }).join("");
}
window.printRecord=id=>{
  const r=records().find(x=>x.id===id);
  if(!r){
    alert("저장된 기록을 찾을 수 없습니다.");
    return;
  }
  try{
    buildPrintSheet(r);
    const imgs=[...$("printSheet").querySelectorAll("img")];
    const waits=imgs.map(img=>img.complete ? Promise.resolve() : new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;}));
    Promise.all(waits).then(()=>setTimeout(()=>window.print(),150));
  }catch(err){
    console.error(err);
    alert("출력 화면을 만드는 중 오류가 발생했습니다. 새로고침 후 다시 시도해주세요.");
  }
};

window.deleteRecord=async id=>{
  if(!confirm("이 기록을 삭제할까요?")) return;
  try{
    await apiRequest(`${API_URL}?id=eq.${encodeURIComponent(id)}`, {
      method:"DELETE",
      headers:{"Prefer":"return=minimal"}
    });
    await loadCloudRecords();
  }catch(err){
    console.error(err);
    alert("기록을 삭제하지 못했습니다.");
  }
};
window.loadRecord=id=>{
  const r=records().find(x=>x.id===id); if(!r)return;
  equipment.value=r.equipmentKey; renderEquipment();
  $("workDate").value=r.date||"";$("place").value=r.place||"";$("startTime").value=r.start||"";$("endTime").value=r.end||"";
  $("worker").value=r.worker||"";$("workContent").value=r.content||"";$("remarks").value=r.remarks||"";$("writer").value=r.writer||"";$("supervisor").value=r.supervisor||"한도연";
  calcDuration();
  window.scrollTo({top:0,behavior:"smooth"});
};
$("deleteAllBtn").addEventListener("click", async ()=>{
  if(!records().length)return;
  if(!confirm("저장된 모든 온라인 기록을 삭제할까요?")) return;
  try{
    await apiRequest(`${API_URL}?id=gt.0`, {
      method:"DELETE",
      headers:{"Prefer":"return=minimal"}
    });
    await loadCloudRecords();
  }catch(err){
    console.error(err);
    alert("전체 기록을 삭제하지 못했습니다.");
  }
});
$("refreshBtn").addEventListener("click", async ()=>{
  const btn=$("refreshBtn");
  btn.disabled=true;
  btn.textContent="불러오는 중...";
  await loadCloudRecords();
  btn.disabled=false;
  btn.textContent="새로고침";
});
$("csvBtn").addEventListener("click",()=>{
  const arr=records(); if(!arr.length){alert("내보낼 기록이 없습니다.");return;}
  const headers=["날짜","장비","차량번호","작업장소","시작시간","종료시간","작업시간","운전자 및 작업자","작업내용","특이사항","작성자","관리감독자"];
  const rows=arr.map(r=>[r.date,r.equipment,r.vehicleNo,r.place,r.start,r.end,r.duration,r.worker,r.content,r.remarks||"",r.writer,r.supervisor]);
  const csv=[headers,...rows].map(row=>row.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`작업기록_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href);
});

fillTimeOptions();
$("supervisor").value="한도연";
renderEquipment();
$("historyBody").innerHTML=`<tr><td colspan="7" class="empty">온라인 기록을 불러오는 중...</td></tr>`;
loadCloudRecords();
</script>
</body>
</html>
